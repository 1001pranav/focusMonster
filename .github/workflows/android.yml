name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Pinned rather than ubuntu-latest, so a runner image change is a reviewed edit here and not a
# surprise. 26.04 ships the Android SDK and Node 24.
jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test

  apk:
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The basic provider is open source (MIT) and free for private repos; the default "enhanced"
      # one is proprietary and only a free preview for them.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: npm ci
      # android/ is generated (Continuous Native Generation), never committed.
      - run: npx expo prebuild --platform android --no-install
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :usage-stats:testDebugUnitTest
      # Release build: the JS bundle is inside, so the APK runs without a dev server. The template
      # signs it with the shared debug key, which lets each new build install over the last one.
      # arm64 only: every phone this is meant for, at a fraction of the build time.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Name the APK after the commit
        run: mv android/app/build/outputs/apk/release/app-release.apk "focusmonster-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: focusmonster-apk
          path: focusmonster-*.apk
          retention-days: 30
